services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spherio
      POSTGRES_PASSWORD: spherio
      POSTGRES_DB: spherio
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    ports:
      - "${COLYSEUS_PORT:-2567}:2567"
    environment:
      DATABASE_URL: "postgresql://spherio:spherio@postgres:5432/spherio"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-dev-secret}"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./server/src:/app/server/src
      - ./shared/src:/app/shared/src
    command: npm run dev -w @spherio/server

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    ports:
      - "${CLIENT_PORT:-8080}:5173"
    environment:
      VITE_COLYSEUS_ENDPOINT: "ws://localhost:${CLIENT_PORT:-8080}/colyseus"
      VITE_PROXY_TARGET: "http://server:2567"
    volumes:
      - ./client/src:/app/client/src
      - ./client/index.html:/app/client/index.html
      - ./shared/src:/app/shared/src
    command: npm run dev -w @spherio/client -- --host 0.0.0.0 --port 5173
