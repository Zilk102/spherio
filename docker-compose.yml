services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${COLYSEUS_PORT:-2567}:2567"
    environment:
      COLYSEUS_PORT: "2567"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2567/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
